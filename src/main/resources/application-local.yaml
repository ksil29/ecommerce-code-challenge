spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
  tomcat:
    remoteip:
      internal-proxies: "192.168.0.0/16, 172.16.0.0/12, 169.254.0.0/16, fc00::/7, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, fe80::/10, ::1/128"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  admin:
    password: ${ADMIN_PASSWORD:admin}
    allow-weak-password: true
  sample-data:
    enabled: ${SAMPLE_DATA:true}
