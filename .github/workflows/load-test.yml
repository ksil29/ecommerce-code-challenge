name: Load test

on:
  workflow_dispatch:
    inputs:
      browsers_per_sec:
        description: Peak new browsing users per second
        default: "100"
      buyers_per_sec:
        description: New buying users per second
        default: "20"
      duration_seconds:
        description: Duration in seconds
        default: "60"

permissions:
  contents: read

jobs:
  gatling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: docker compose up --build --wait
        env:
          RATE_LIMIT_ENABLED: "false"
      - run: ./gradlew gatlingRun
        env:
          BROWSERS_PER_SEC: ${{ inputs.browsers_per_sec }}
          BUYERS_PER_SEC: ${{ inputs.buyers_per_sec }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report
          path: build/reports/gatling
      - if: always()
        run: docker compose down -v
